<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme (or the system's) before the page paints, so it never flashes the wrong one.
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>{% block title %}MediaGala{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Fredoka:wght@450&family=Titan+One&display=swap">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="MediaGala home">
        <svg class="brand-logo" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
          <!-- glass -->
          <path d="M7.5 3.5h17l-2.6 24a2 2 0 0 1-2 1.8h-7.8a2 2 0 0 1-2-1.8z" fill="rgba(255,255,255,0.07)"/>
          <!-- milk with a wavy surface -->
          <path d="M8.5 12.5Q10.3 11.2 12.1 12.5T15.7 12.5T19.3 12.5T23.5 12.5L21.6 27.2Q21.4 28.3 20.3 28.3H11.7Q10.6 28.3 10.4 27.2Z" fill="#fff"/>
          <!-- glass outline and highlights -->
          <path d="M7.5 3.5h17l-2.6 24a2 2 0 0 1-2 1.8h-7.8a2 2 0 0 1-2-1.8z" fill="none" stroke="#d9d9e3" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M10.4 5.8l.6 4.6" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M12.2 15.5l.8 9.5" stroke="#d9d9e3" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span class="brand-name"><span class="brand-media">MEDIA</span><span class="brand-gala">GALA</span></span>
      </a>
      <div class="header-actions">
        <button type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <a href="/titles/new" class="btn btn-primary"><span aria-hidden="true">+</span> Add title</a>
      </div>
    </div>
  </header>

  <main class="container main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">Built with FastAPI · SQLAlchemy · SQLite · Jinja2</div>
  </footer>
  <script src="{{ static_url('js/theme.js') }}" defer></script>
</body>
</html>
