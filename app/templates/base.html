<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}MediaGala{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand" aria-label="MediaGala home">
        <svg class="brand-logo" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
          <!-- glass -->
          <path d="M7.5 3.5h17l-2.6 24a2 2 0 0 1-2 1.8h-7.8a2 2 0 0 1-2-1.8z" fill="rgba(255,255,255,0.07)"/>
          <!-- milk with a wavy surface -->
          <path d="M8.5 12.5Q10.3 11.2 12.1 12.5T15.7 12.5T19.3 12.5T23.5 12.5L21.6 27.2Q21.4 28.3 20.3 28.3H11.7Q10.6 28.3 10.4 27.2Z" fill="#fff"/>
          <!-- glass outline and highlights -->
          <path d="M7.5 3.5h17l-2.6 24a2 2 0 0 1-2 1.8h-7.8a2 2 0 0 1-2-1.8z" fill="none" stroke="#d9d9e3" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M10.4 5.8l.6 4.6" stroke="#fff" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M12.2 15.5l.8 9.5" stroke="#d9d9e3" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <span class="brand-name"><span class="brand-media">MEDIA</span><span class="brand-gala">GALA</span></span>
      </a>
      <a href="/titles/new" class="btn btn-primary"><span aria-hidden="true">+</span> Add title</a>
    </div>
  </header>

  <main class="container main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">Built with FastAPI · SQLAlchemy · SQLite · Jinja2</div>
  </footer>
</body>
</html>
