{# One small line-icon set, drawn in the text colour. Decorative: the button or link says what it does. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == "play" %}<path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/>
  {%- elif name == "edit" %}<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
  {%- elif name == "trash" %}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
  {%- elif name == "external" %}<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>
  {%- elif name == "refresh" %}<path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/>
  {%- elif name == "sparkle" %}<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>
  {%- endif %}
</svg>
{%- endmacro %}
