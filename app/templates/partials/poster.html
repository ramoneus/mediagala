<div class="poster poster-{{ item.kind.value }}{{ ' ' ~ poster_class if poster_class }}">
  {% if item.poster_filename %}
    <img src="/posters/{{ item.poster_filename }}" alt="" loading="lazy">
  {% else %}
    {# No image: a typeset cover in the kind's colour, decorative since the title is shown next to it. #}
    <div class="poster-type" aria-hidden="true">
      <span class="poster-type-title">{{ item.title }}</span>
      <span class="poster-type-meta">{{ item.kind.label }} · {{ item.year }}</span>
    </div>
  {% endif %}
  <span class="badge badge-{{ item.status.value }}">{{ item.status_label }}</span>
  {% if item.rating %}
    <span class="rating" title="Your rating">
      <span aria-hidden="true">★</span> {{ item.rating }}<small>/10</small>
    </span>
  {% endif %}
</div>
